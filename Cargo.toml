[package]
name = "auto-paint"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Watch Codex draw in Paintrs and record the result"
license = "MIT"
repository = "https://github.com/bitplane/auto-paint"
readme = "README.md"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
flite-rs = { version = "0.2", default-features = false, features = ["kal16"] }
fontdue = "0.9.3"
getrandom = "0.4"
maudio = "0.1.15"
muxide = { version = "0.5", default-features = false }
openh264 = "0.9.10"
paintrs = "0.1.2"
rusty_aac = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
