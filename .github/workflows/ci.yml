name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            binary: target/release/auto-paint
          - runner: windows-2025
            binary: target/release/auto-paint.exe
          - runner: macos-15
            binary: target/release/auto-paint
          - runner: macos-15-intel
            binary: target/release/auto-paint
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: bash scripts/check.sh
      - run: cargo build --locked --release
      - name: Record a drawing
        run: python scripts/smoke.py ${{ matrix.binary }}
      - name: Install video and window test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg xvfb xauth libxkbcommon-x11-0
      - name: Verify narrated and silent recordings
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke.py ${{ matrix.binary }} --watch --ffprobe
          python scripts/smoke.py ${{ matrix.binary }} --no-narrate --ffprobe
